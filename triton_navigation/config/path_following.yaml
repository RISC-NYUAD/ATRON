path_following_controller:
  ros__parameters:
    # Lookahead distance for Pure Pursuit (meters)
    # Larger values = smoother paths but less accurate tracking
    lookahead_distance: 0.4 
    
    # Maximum velocities
    max_linear_velocity: 0.6   # m/s
    max_angular_velocity: 0.3  # rad/s
    min_linear_velocity: 0.0   # m/s - minimum speed to avoid getting stuck
    
    # Goal tolerance - stop when within this distance of goal (meters)
    goal_tolerance: 0.3
    
    # Control loop frequency (Hz)
    control_frequency: 50.0
    
    angular_velocity_gain: 2.0
    
    ?slowdown_radius: 0.5
    
    # Maximum distance to accept a new path (meters)
    # Paths starting farther than this from robot are rejected
    max_path_start_distance: 0.5
    
    # Minimum path completion before checking goal (0.0 to 1.0)
    # Prevents premature goal detection in cyclic paths
    # 0.8 = must complete at least 80% of path before goal check
    min_path_completion: 0.8

    # Path smoothing:
    # - false: follow the interpolated path (default behavior)
    # - true: generate and follow bezier interpolation
    smooth_path: true

    # Controller type:
    # - "pure_pursuit": geometric pure pursuit (constant linear velocity)
    # - "regulated_pure_pursuit": pure pursuit with curvature-based velocity regulation
    # - "point_turn": only turn in place or drive straight
    # - "yaw_control": smooth yaw-correcting controller (no in-place turns)
    controller_type: "regulated_pure_pursuit"

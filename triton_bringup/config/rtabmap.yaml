# Parameters for ICP odometry, SLAM, and visualization nodes

icp_odometry:
  ros__parameters:
    # --- Basic Parameters ---
    frame_id: "imu_stabilized"           # Your robot's base frame
    odom_frame_id: "icp_odom"           # Odometry frame generated by this node
    guess_frame_id: "vslam_map"
    publish_tf: true                # Publish the odom -> imu_frame transform
    wait_for_transform: 0.2         # Wait for TF to be available
    
    # --- QoS ---
    qos_scan: 2                     # Best effort for scan topic

    approx_sync: "true"

    # --- ICP Odometry Parameters ---
    # For a full list of parameters, see:
    # https://github.com/introlab/rtabmap/blob/master/corelib/include/rtabmap/core/Parameters.h
    Icp/PointToPlane: "false"
    Icp/VoxelSize: "0.1"
    Icp/MaxCorrespondenceDistance: "0.2"
    Icp/MaxIterations: "10"
    Icp/PM: "true"                  # Use Point-to-Metric (requires Icp/PointToPlane=true)
    Icp/PMOutlierRatio: "0.7"
    Icp/Epsilon: "0.001"
    Odom/Strategy: "0"              # 0=Frame-to-frame, 1=Frame-to-map
    Odom/GuessMotion: "true"
    Odom/ResetCountdown: "0"        # Don't reset odometry
    Reg/Force3DoF: "true"           # Force 2D/3DoF odometry

rtabmap:
  ros__parameters:
    # --- Basic Parameters ---
    frame_id: "laser_frame"
    odom_frame_id: "icp_odom"
    map_frame_id: "map"
    publish_tf: true
    
    # --- Subscriptions ---
    subscribe_depth: false
    subscribe_rgbd: false
    subscribe_scan: true
    subscribe_odom_info: true       # Subscribe to the odom topic from icp_odometry
    
    # --- QoS ---
    qos_scan: 2
    qos_odom: 2

    # --- RTAB-Map Core Parameters ---
    Rtabmap/DetectionRate: "1"
    Rtabmap/CreateIntermediateNodes: "true"

    # --- Registration for Loop Closure ---
    Reg/Strategy: "1"               # 1=ICP
    Reg/Force3DoF: "true"
    
    # --- Grid Map Parameters ---
    Grid/FromScan: true
    Grid/FromDepth: false
    Grid/CellSize: "0.1"
    Grid/RangeMax: "20.0"

rtabmap_viz:
  ros__parameters:
    # --- Basic Parameters ---
    frame_id: "laser_frame"
    odom_frame_id: "icp_odom"
    map_frame_id: "map"

    # --- Subscriptions ---
    subscribe_scan: true
    subscribe_odom_info: true
    
    # --- QoS ---
    qos_scan: 2
    qos_odom: 2